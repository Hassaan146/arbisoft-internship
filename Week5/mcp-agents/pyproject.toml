[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, B bugbear, UP pyupgrade, SIM simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"ra_bridge.py" = ["E402"]  # imports intentionally follow sys.path setup
"tests/*" = ["B011"]
